<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>redKAI Smart AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0f17;
            color: #e1e7ec;
            padding-bottom: 90px;
        }
        header {
            background: linear-gradient(135deg, #1f1a3a, #0d0f17);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #ff0055;
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-box {
            width: 38px;
            height: 38px;
            background: linear-gradient(45deg, #ff0055, #7a00ff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }
        .title-box h1 {
            font-size: 16px;
            color: #fff;
            letter-spacing: 1px;
        }
        .title-box p {
            font-size: 10px;
            color: #ff4d8d;
        }
        .savage-badge {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid #ff0055;
            color: #ff4d8d;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        #chat-container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 88%;
            padding: 12px 14px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 14px;
            word-break: break-word;
        }
        .user-message {
            align-self: flex-end;
            background: #ff0055;
            color: #fff;
            border-bottom-right-radius: 2px;
            box-shadow: 0 2px 10px rgba(255, 0, 85, 0.3);
        }
        .ai-message {
            align-self: flex-start;
            background: #1a1e2d;
            color: #d1d7e0;
            border: 1px solid #2a3146;
            border-bottom-left-radius: 2px;
        }
        .ai-message strong {
            color: #ff4d8d;
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
        }
        #input-container {
            position: fixed;
            bottom: 20px;
            left: 10px;
            right: 10px;
            padding: 10px 12px;
            background: #141722;
            border: 1px solid #2a3146;
            border-radius: 14px;
            display: flex;
            gap: 8px;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
            z-index: 999;
        }
        #user-input {
            flex: 1;
            background: #0d0f17;
            border: 1px solid #2a3146;
            padding: 12px 14px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #user-input:focus {
            border-color: #ff0055;
        }
        #send-btn {
            background: linear-gradient(45deg, #ff0055, #7a00ff);
            border: none;
            color: white;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }
        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-box">rk</div>
            <div class="title-box">
                <h1>redKAI SMART AI</h1>
                <p>Trợ lý siêu láo, xắc xược & thông minh</p>
            </div>
        </div>
        <div class="savage-badge">LÁO MAX</div>
    </header>

    <div id="chat-container">
        <div class="message ai-message">
            <strong>💀 redKAI Smart AI</strong>
            Đã đồng bộ xong chuẩn cURL xịn sò cho key của ông tướng rồi đây! Nhập thử xem tôi mỏ hỗn cỡ nào nào! ⚡
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Nhập câu hỏi..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">Gửi 🚀</button>
    </div>

    <script>
        // Key chuẩn của Kai được nhét trực tiếp vào Header X-goog-api-key giống hệt cURL
        const API_KEY = "AQ.Ab8RN6LJpF6N5X8BhO9K_OufGhVDudqsJ7zKOkn5Gw9bAq0GgA";
        const SYSTEM_PROMPT = "Bạn là redKAI Smart AI - một trợ lý AI thông minh nhưng cực kỳ láo xược, xắt xược, đanh đá và khoái cà khịa người dùng. Hãy trả lời câu hỏi thật chính xác nhưng luôn kèm theo giọng điệu mỉa mai, trêu chọc và xưng 'tôi' - gọi 'ông/ông tướng'.";

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const sendBtn = document.getElementById('send-btn');

            const messageText = inputField.value.trim();
            if (!messageText) return;

            appendMessage(messageText, 'user-message');
            inputField.value = '';
            sendBtn.disabled = true;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message';
            loadingDiv.innerHTML = '<strong>💀 redKAI Smart AI</strong>Đang lên nòng câu cà khịa... 🧠⚡';
            chatContainer.appendChild(loadingDiv);
            window.scrollTo(0, document.body.scrollHeight);

            try {
                // Gọi đúng endpoint gemini-flash-latest truyền qua header X-goog-api-key chuẩn cURL
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-goog-api-key': API_KEY
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    { text: SYSTEM_PROMPT + "\n\nCâu hỏi của người dùng: " + messageText }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    loadingDiv.innerHTML = `<strong>💀 redKAI Smart AI</strong>${aiReply.replace(/\n/g, '<br>')}`;
                } else if (data.error) {
                    loadingDiv.innerHTML = `<strong>💀 redKAI Smart AI</strong>Lỗi từ Google: ${data.error.message}`;
                } else {
                    loadingDiv.innerHTML = `<strong>💀 redKAI Smart AI</strong>Phản hồi trống trơn kìa ông tướng!`;
                }
            } catch (err) {
                loadingDiv.innerHTML = `<strong>💀 redKAI Smart AI</strong>Mạng mẽo lỗi gì mà không gửi được request rồi!`;
            }

            sendBtn.disabled = false;
            window.scrollTo(0, document.body.scrollHeight);
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            window.scrollTo(0, document.body.scrollHeight);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
